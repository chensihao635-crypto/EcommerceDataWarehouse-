# ============================================================
# 电商用户订单数据仓库分析平台 - 配置文件
# ============================================================

# 数据库配置 (MySQL 8.0)
database:
  host: localhost
  port: 3306
  name: ecommerce_dw
  user: root
  password: "123456" # MySQL密码
  # driver: pymysql

# ETL配置
etl:
  # 数据源配置
  source_file: data/Online Retail.xlsx

  # 数据输出目录
  ods_dir: data/ods
  dwd_dir: data/dwd
  dws_dir: data/dws

  # 数据清洗规则
  cleaning:
    remove_missing_customer: true
    remove_cancelled_orders: true
    remove_abnormal_quantity: true
    remove_negative_price: true

  # 批量加载大小
  batch_size: 5000

  # 日志级别
  log_level: INFO

# 数据仓库层级
warehouse:
  layers:
    - ods # 原始数据层
    - dwd # 数据明细层
    - dws # 数据汇总层
    - ads # 应用数据层
